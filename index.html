<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데일리 라운드넥 니트 | 쇼핑몰 A/B 테스트</title>
  <!-- VWO SmartCode: 실험 생성 후 VWO에서 제공한 SmartCode를 여기에 붙여 넣으세요. -->
  <!-- VWO SMARTCODE START -->
  <!-- Paste your VWO SmartCode here -->

  <style>
    :root {
      --pink: #f52d50;
      --pink-dark: #df1f43;
      --text: #202124;
      --muted: #777d87;
      --line: #e8e9ed;
      --soft: #fff0f3;
      --page: #ffffff;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--page);
      font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .topbar {
      height: 72px;
      padding: 0 5%;
      display: flex;
      align-items: center;
      gap: 34px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -1.5px;
      white-space: nowrap;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 25px;
      font-size: 14px;
      font-weight: 700;
    }
    .search {
      margin-left: auto;
      width: min(280px, 25vw);
      padding: 12px 17px;
      border: 0;
      border-radius: 24px;
      background: #f5f5f7;
      color: #666;
      outline: none;
    }
    .header-icons { display: flex; gap: 18px; font-size: 23px; }
    .breadcrumb {
      max-width: 1240px;
      margin: 22px auto;
      padding: 0 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .product-layout {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: minmax(0, 1.03fr) minmax(360px, 1fr);
      gap: 42px;
      align-items: start;
    }
    .gallery {
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr);
      gap: 12px;
    }
    .thumbnails { display: flex; flex-direction: column; gap: 10px; }
    .thumb {
      width: 68px;
      height: 82px;
      border: 1px solid var(--line);
      border-radius: 5px;
      overflow: hidden;
      background: #f5f3f0;
      padding: 0;
    }
    .thumb.active { border: 2px solid #222; }
    .thumb img, .main-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .main-image {
      position: relative;
      aspect-ratio: 0.79;
      overflow: hidden;
      border-radius: 5px;
      background: #f3f0ec;
    }
    .image-count {
      position: absolute;
      bottom: 14px;
      right: 14px;
      padding: 4px 10px;
      color: #fff;
      border-radius: 20px;
      background: #2229;
      font-size: 12px;
    }

    .seller { color: #777d87; font-size: 14px; margin: 2px 0 8px; }
    h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: -1px; }
    .rating { color: #444b55; font-size: 14px; margin-bottom: 26px; }
    .rating .star { color: #ffad28; }
    .original-price { color: #737780; text-decoration: line-through; font-size: 16px; }
    .price-line { display: flex; align-items: center; gap: 12px; margin-top: 5px; }
    .price { color: var(--pink); font-size: 33px; font-weight: 800; letter-spacing: -1px; }
    .discount {
      border: 1px solid var(--pink);
      border-radius: 4px;
      color: var(--pink);
      padding: 3px 6px;
      font-size: 13px;
      font-weight: 700;
    }
    .rule { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
    .option-title { font-size: 13px; font-weight: 700; margin: 20px 0 11px; }
    .colors { display: flex; gap: 12px; }
    .color {
      width: 29px;
      height: 29px;
      border: 1px solid #ddd;
      border-radius: 50%;
      box-shadow: inset 0 0 0 2px white;
    }
    .color.selected { outline: 1.5px solid #333; outline-offset: 3px; }
    .sizes { display: flex; gap: 10px; }
    .size {
      min-width: 59px;
      padding: 10px 15px;
      border: 1px solid #d9dce2;
      border-radius: 6px;
      background: #fff;
    }
    .size.selected { border: 1.5px solid #222; font-weight: 700; }

    .limited-offer {
      margin-top: 27px;
      padding: 15px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-radius: 11px;
      background: linear-gradient(100deg, #f52d50, #ee2447);
      color: white;
      font-weight: 800;
      font-size: 18px;
    }
    .limited-label { display: flex; align-items: center; gap: 10px; }
    .timer {
      white-space: nowrap;
      padding: 6px 10px;
      border-radius: 20px;
      background: #b91535;
      font-size: 13px;
      letter-spacing: 1px;
    }
    .saving-message {
      margin-top: 8px;
      padding: 17px 18px;
      border-radius: 10px;
      background: var(--soft);
      color: var(--pink);
      font-weight: 800;
      font-size: 18px;
    }
    .saving-message span { margin-right: 9px; }
    .buy-row { display: grid; grid-template-columns: 1fr 58px; gap: 10px; margin-top: 20px; }
    .buy-button {
      min-height: 56px;
      border: 0;
      border-radius: 10px;
      background: var(--pink);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 3px 0 #d51e40;
      transition: background .15s ease, transform .15s ease;
    }
    .buy-button:hover { background: var(--pink-dark); }
    .buy-button:active { transform: translateY(1px); }
    .wish-button {
      border: 1px solid #dfe1e6;
      border-radius: 9px;
      background: #fff;
      font-size: 23px;
    }
    .benefits {
      margin: 28px 0 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .benefit { display: flex; gap: 9px; align-items: flex-start; font-size: 12px; }
    .benefit .emoji { font-size: 22px; }
    .benefit strong { display: block; font-size: 13px; margin-bottom: 5px; }
    .benefit span:last-child { color: var(--muted); line-height: 1.5; }

    .details {
      max-width: 1240px;
      margin: 62px auto 80px;
      padding: 0 20px;
    }
    .tabs { display: flex; gap: 34px; border-bottom: 1px solid var(--line); }
    .tab {
      padding: 0 0 15px;
      border: 0;
      background: transparent;
      color: #777d87;
      font-weight: 700;
    }
    .tab.active { color: #222; border-bottom: 2px solid #222; }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      padding-top: 30px;
      color: #555d68;
      font-size: 14px;
      line-height: 1.9;
    }
    .detail-grid h2 { color: #222; font-size: 17px; }
    .notice {
      margin-top: 28px;
      padding: 15px;
      border-radius: 8px;
      background: #f8f8fa;
      color: #666;
      font-size: 12px;
      line-height: 1.6;
    }
    footer { border-top: 1px solid var(--line); padding: 25px 20px; text-align: center; color: #888; font-size: 12px; }

    @media (max-width: 850px) {
      .topbar { height: 62px; padding: 0 16px; gap: 18px; }
      .nav { display: none; }
      .search { width: 42vw; }
      .header-icons { gap: 10px; }
      .product-layout { grid-template-columns: 1fr; gap: 28px; padding: 0 16px; }
      .breadcrumb { margin: 16px auto; }
      .gallery { grid-template-columns: 54px minmax(0, 1fr); gap: 8px; }
      .thumb { width: 54px; height: 65px; }
      h1 { font-size: 24px; }
      .details { margin-top: 42px; padding: 0 16px; }
      .detail-grid { grid-template-columns: 1fr; gap: 20px; }
    }
    @media (max-width: 430px) {
      .logo { font-size: 22px; }
      .search { display: none; }
      .header-icons { margin-left: auto; }
      .limited-offer { font-size: 15px; padding: 13px; }
      .timer { font-size: 11px; }
      .price { font-size: 29px; }
      .benefits { gap: 7px; }
      .benefit { gap: 4px; }
      .benefit strong { font-size: 11px; }
      .benefit { font-size: 10px; }
    }
  </style>
</head>
